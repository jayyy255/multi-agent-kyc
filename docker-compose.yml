version: '3.8'

services:
  kyc-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multi-agent-kyc-backend
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=multi-agent-kyc-backend
      - APP_ENV=production
      - DEBUG=false
      - LOG_LEVEL=INFO
      - MASK_PII_LOGS=true
      - REQUIRE_API_KEY=false
      - API_KEY=kyc-dev-secret-key-change-in-prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
